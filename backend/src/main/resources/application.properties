spring.application.name=backend

# PostgreSQL connection. Override with environment variables (DB_URL, DB_USERNAME, DB_PASSWORD) when needed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trippilot}
spring.datasource.username=${DB_USERNAME:trippilot}
spring.datasource.password=${DB_PASSWORD:trippilot}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches the entities.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${PORT:8080}

management.endpoints.web.exposure.include=health,info

# Return the error message (e.g. which plan field is missing) in 4xx responses.
server.error.include-message=always
